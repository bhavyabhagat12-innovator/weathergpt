name: Unzip Project
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract Code
        run: |
          unzip weathergpt.zip -d .
          rm weathergpt.zip
      - name: Commit Extracted Code
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add -A
          git commit -m "Extracted full project structure" || exit 0
          git push
